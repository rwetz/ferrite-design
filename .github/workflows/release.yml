name: Release
on:
  push:
    branches: [main]
    tags: ["v*"]
concurrency:
  group: release
  queue: max
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ steps.release.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release version rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Prepare versioned release
        id: release
        run: python3 .github/scripts/prepare_release.py

  check:
    needs: prepare
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --locked
  release:
    needs: [prepare, check]
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Ferrite Design $RELEASE_TAG" --generate-notes
          fi
