[package]
name = "ferrite-design"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Ryan Wetzstein"]
description = "The design language for Ferrite-family GPUI apps: amber-on-iron tokens, pixel display type, ordered-dither and ASCII primitives, square window chrome."
repository = "https://github.com/rwetz/ferrite-design"
keywords = ["gpui", "design-system", "dither", "ascii", "ui"]
categories = ["gui"]

[dependencies]
# Ferrite depends on gpui and nothing built on top of it: every component is
# its own. Pinned exactly so a gpui release can't change behaviour under us;
# the two crates must stay on the same version.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
anyhow = "1"
# Grapheme-aware caret movement in the text input.
unicode-segmentation = "1"
# Same major as gpui's; dither rasters are handed to gpui as image::Frame.
image = { version = "0.25", default-features = false }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS only: `font-kit` is gpui's macOS text system. Without it gpui-pre-macos
# swaps in a no-op one and renders no text at all, warning only through `log`
# (PITFALLS 41). Merges with the gpui_platform entry above, for macOS builds.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux only: gpui-pre-platform depends on gpui-pre-linux with default
# features off, so without these there is no display backend and every
# window opens headless — the app runs and nothing appears (PITFALLS 44).
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["x11", "wayland"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Same major as gpui's own windows dependency; used to opt out of Windows
# 11's forced rounded corners (see chrome::square_corners) and to read the
# local time zone for Date::today.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
# Already in gpui's tree; localtime_r gives Date::today the local time zone.
libc = "0.2"

# gpui is unusably slow unoptimised. Optimise every
# dependency even in dev builds; our own crate stays debuggable.
[profile.dev.package."*"]
opt-level = 3

# Ferrite itself, when building this repo's examples: at opt-level 0 a
# re-render of the gallery costs ~3x more, enough to make a modal's open
# animation hitch (PITFALLS §49). Apps get Ferrite at 3 via the line above.
[profile.dev]
opt-level = 1

